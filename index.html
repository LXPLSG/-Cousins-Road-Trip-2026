<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>陈Cousins Road Trip 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --kl:#1D9E75; --kl-bg:#E8F8F2; --kl-dark:#085041;
  --gt:#7F77DD; --gt-bg:#EEEDFE; --gt-dark:#26215C;
  --ml:#D85A30; --ml-bg:#FAECE7; --ml-dark:#712B13;
  --dr:#D97706; --dr-bg:#FEF3C7;
  --waze:#00D4B4; --waze-dk:#00876E;
  --navy:#0F172A; --text:#1E293B; --muted:#64748B;
  --border:#E2E8F0; --bg:#F1F5F9; --card:#FFFFFF;
  --r:12px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}

/* ── HEADER ── */
.app-header{background:var(--navy);padding:16px 20px 14px;position:sticky;top:0;z-index:100}
.header-flag{font-size:22px;line-height:1}
.header-row{display:flex;align-items:center;gap:10px}
.header-title{font-family:'Crimson Pro',serif;font-size:21px;font-weight:600;color:#fff;letter-spacing:0.01em}
.header-sub{font-size:11px;color:rgba(255,255,255,.5);margin-top:3px;font-weight:300}
.header-pills{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.header-pill{font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.75);padding:3px 9px;border-radius:20px}

/* ── BOTTOM NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.nav-btn{flex:1;border:none;background:none;padding:10px 8px 8px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s;-webkit-tap-highlight-color:transparent}
.nav-btn.active{color:var(--navy)}
.nav-btn svg{width:22px;height:22px}
.nav-dot{width:4px;height:4px;border-radius:50%;background:transparent;margin-top:1px}
.nav-btn.active .nav-dot{background:var(--navy)}

/* ── PAGES ── */
.page{display:none}.page.active{display:block}
.page-content{padding:16px;max-width:680px;margin:0 auto}

/* ── SECTION HEADERS ── */
.section-header{display:flex;align-items:center;gap:10px;padding:14px 0 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted)}
.section-line{flex:1;height:1px;background:var(--border)}

/* ── DAY CARDS (Full Plan) ── */
.day-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.day-card-header{padding:14px 16px 12px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:flex-start;gap:12px}
.day-num{font-size:11px;font-weight:700;color:#fff;padding:4px 8px;border-radius:6px;min-width:46px;text-align:center;flex-shrink:0;margin-top:1px}
.day-card-info{flex:1;min-width:0}
.day-date{font-size:11px;color:var(--muted);font-weight:400}
.day-title-text{font-size:15px;font-weight:600;margin-top:2px;line-height:1.3}
.day-hotel-txt{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:4px}
.chevron{width:18px;height:18px;color:var(--muted);transition:transform 0.2s;flex-shrink:0;margin-top:2px}
.day-card.open .chevron{transform:rotate(180deg)}
.day-body{display:none;padding:0 16px 14px}
.day-card.open .day-body{display:block}

/* ── ROUTE BOX ── */
.route-box{border-radius:var(--rs);padding:10px 12px;margin-bottom:12px}
.route-box.nav-box{background:#E8FBF8;border:1px solid var(--waze)}
.route-box.drive-warn{background:#FEF9EC;border:1px solid var(--dr)}
.route-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.nav-box .route-hdr{color:var(--waze-dk)}.drive-warn .route-hdr{color:#92400E}
.route-seg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid rgba(0,0,0,.06)}
.route-seg:first-of-type{border-top:none}
.route-seg-label{flex:1;font-size:12px;min-width:130px;line-height:1.4}
.route-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.waze-btn{display:inline-flex;align-items:center;gap:4px;background:var(--waze);color:#fff;text-decoration:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:6px;white-space:nowrap;font-family:'Outfit',sans-serif;letter-spacing:.01em}
.stop-pill{font-size:10px;background:#FDE68A;color:#92400E;border:1px solid #FCD34D;padding:1px 6px;border-radius:20px}
.direct-row{background:rgba(0,0,0,.03);border-radius:6px;padding:5px 8px;margin-top:4px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}

/* ── ACTIVITIES ── */
.activity{display:block;padding:8px 0;border-top:1px solid var(--border)}
.activity:first-child{border-top:none;padding-top:0}
.act-time{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.act-body{width:100%}
.act-text{font-size:13px;line-height:1.5;color:var(--text)}
.act-text b{font-weight:600}
.act-contact{font-size:11px;color:var(--muted);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.t-food{background:#FEF3C7;color:#92400E}
.t-kids{background:#FDF2F8;color:#9D174D}
.t-shop{background:#ECFDF5;color:#065F46}
.t-sight{background:#EDE9FE;color:#4C1D95}
.t-act{background:#EEF2FF;color:#3730A3}
.t-tip{background:#FEF2F2;color:#991B1B}
.t-walk{background:#F0FDF4;color:#14532D;border:1px solid #BBF7D0}
.t-grab{background:#EFF6FF;color:#1E40AF;border:1px solid #BFDBFE}
.t-drive{background:#FFFBEB;color:#78350F;border:1px solid #FDE68A}
.t-drvrec{background:#FEF3C7;color:#78350F;border:1px solid #FCD34D}
.t-drend{background:#F1F5F9;color:#475569;border:1px solid #CBD5E1}

/* ── DINNER OPTIONS ── */
.dinner-wrap{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.d-opt{border-radius:var(--rs);padding:10px 12px;font-size:12px;line-height:1.5}
.d-opt-a{background:#E8F8F2;border:1px solid #6EE7B7}
.d-opt-b{background:var(--bg);border:1px solid var(--border);color:var(--muted)}
.d-opt-title{font-size:13px;font-weight:600;margin-bottom:4px;color:var(--text)}
.d-rec{display:inline-block;font-size:10px;background:#D1FAE5;color:#065F46;padding:2px 8px;border-radius:20px;margin-left:6px}
.d-drive-note{background:#FEF9EC;border:1px solid #FCD34D;border-radius:6px;padding:7px 10px;font-size:11px;color:#78350F;margin-top:6px;display:flex;gap:6px;align-items:flex-start}

/* ── WARN INLINE ── */
.inline-warn{background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--rs);padding:8px 10px;margin-top:6px;font-size:11px;color:#78350F;display:flex;gap:6px}

/* ── TODAY PAGE ── */
.today-hero{padding:22px 20px 16px;border-bottom:1px solid var(--border);background:#fff}
.today-status-line{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px}
.today-big{display:flex;align-items:flex-end;gap:14px}
.today-daynum{font-family:'Crimson Pro',serif;font-size:56px;font-weight:600;line-height:1;color:var(--navy)}
.today-big-right{padding-bottom:6px}
.today-datelabel{font-size:13px;color:var(--muted)}
.today-main-title{font-size:19px;font-weight:700;margin-top:8px;line-height:1.3;color:var(--text)}
.today-dest-pill{display:inline-block;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;margin-top:8px;color:#fff;letter-spacing:.02em}
.today-hotel{font-size:11px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:5px}
.today-body{padding:16px;max-width:680px;margin:0 auto}
.today-sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:14px 0 10px}

/* Today route */
.today-route{border-radius:var(--rs);padding:12px;margin-bottom:12px}
.today-route.nav{background:#E8FBF8;border:1px solid var(--waze)}
.today-route.warn{background:#FEF9EC;border:1px solid var(--dr)}
.today-route-hdr{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.today-route.nav .today-route-hdr{color:var(--waze-dk)}
.today-route.warn .today-route-hdr{color:#92400E}
.today-rseg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid rgba(0,0,0,.07)}
.today-rseg:first-of-type{border-top:none}
.today-rseg-label{flex:1;font-size:13px;font-weight:500;min-width:130px;line-height:1.4}
.today-rmeta{font-size:11px;color:var(--muted);white-space:nowrap}
.waze-btn-lg{display:inline-flex;align-items:center;gap:5px;background:var(--waze);color:#fff;text-decoration:none;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;white-space:nowrap;font-family:'Outfit',sans-serif}

/* Today timeline */
.timeline{position:relative;padding-left:32px}
.timeline::before{content:'';position:absolute;left:7px;top:14px;bottom:14px;width:1px;background:var(--border)}
.tl-item{position:relative;padding:0 0 12px}
.tl-item:last-child{padding-bottom:0}
.tl-dot{position:absolute;left:-28px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--border);z-index:1}
.tl-dot.active{background:var(--navy);border-color:var(--navy)}
.tl-card{background:#fff;border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px}
.tl-time{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.tl-title{font-size:14px;font-weight:600;color:var(--text)}
.tl-detail{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.tl-contact{font-size:11px;color:var(--waze-dk);margin-top:4px;font-weight:500}

/* Today warn */
.today-warn{background:#FEF3C7;border:1px solid #FCD34D;border-radius:var(--rs);padding:10px 12px;font-size:12px;color:#78350F;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}

/* Today dinner options */
.today-dinner-wrap{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.td-opt{border-radius:var(--rs);padding:11px 13px}
.td-opt-a{background:#E8F8F2;border:1px solid #6EE7B7}
.td-opt-b{background:var(--bg);border:1px solid var(--border)}
.td-opt-title{font-size:14px;font-weight:600;margin-bottom:5px}
.td-opt-detail{font-size:12px;color:var(--muted);line-height:1.5}
.td-drive-note{background:#FEF9EC;border:1px solid #FCD34D;border-radius:6px;padding:8px 11px;font-size:12px;color:#78350F;margin-top:8px;display:flex;gap:6px}

/* Off-trip states */
.offtrip{text-align:center;padding:60px 24px}
.offtrip-emoji{font-size:60px;margin-bottom:16px}
.offtrip-title{font-family:'Crimson Pro',serif;font-size:30px;font-weight:600;color:var(--navy);margin-bottom:8px}
.offtrip-sub{font-size:15px;color:var(--muted);line-height:1.6}
.countdown-num{font-family:'Crimson Pro',serif;font-size:80px;font-weight:600;color:var(--navy);line-height:1;margin:8px 0 4px}
.countdown-unit{font-size:14px;color:var(--muted);font-weight:400}

/* Scrollbar */
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Desktop tweaks */
@media(min-width:640px){.page-content{padding:20px 24px}.today-body{padding:20px 24px}.today-hero{padding:28px 24px 20px}}
</style>
</head>

const DEST_META = {
  kl:    {label:"Kuala Lumpur",   color:"#1D9E75", bg:"#E8F8F2"},
  genting:{label:"Genting Highlands",color:"#7F77DD",bg:"#EEEDFE"},
  melaka: {label:"Melaka",         color:"#D85A30", bg:"#FAECE7"},
  drive:  {label:"Drive Day",      color:"#D97706", bg:"#FEF3C7"}
};

// ═══════════════════════════════════════
// RENDER HELPERS
// ═══════════════════════════════════════
const TAGS = {
  food:"t-food",kids:"t-kids",shopping:"t-shop",sights:"t-sight",
  activity:"t-act",tip:"t-tip"
};
const TRANSPORT_TAGS = {
  walk:{cls:"t-walk",label:"🚶 Walk"},
  grab:{cls:"t-grab",label:"🚕 Grab"},
  drive:{cls:"t-drive",label:"🚗 Drive"},
  "drive-end":{cls:"t-drend",label:"🅿️ Park & done"},
  "drive-rec":{cls:"t-drvrec",label:"⚠️ Drive rec."}
};

function tagHTML(tags, transport) {
  let h = '<div class="tags">';
  if (transport && TRANSPORT_TAGS[transport]) {
    const t = TRANSPORT_TAGS[transport];
    h += `<span class="tag ${t.cls}">${t.label}</span>`;
  }
  (tags||[]).forEach(t => {
    if (TAGS[t]) h += `<span class="tag ${TAGS[t]}">${t}</span>`;
  });
  h += '</div>';
  return h;
}

function routeBoxHTML(route, size) {
  if (!route) return '';
  const isBig = size === 'big';
  const boxCls = route.type === 'nav' ? 'nav' : 'warn';
  let h = `<div class="${isBig ? 'today-route' : 'route-box'} ${isBig ? boxCls : (route.type==='nav'?'nav-box':'drive-warn')}">`;
  h += `<div class="${isBig ? 'today-route-hdr' : 'route-hdr'}">`;
  h += route.type === 'nav' ? '🗺 ' : '⚠️ ';
  h += route.title + '</div>';
  route.segs.forEach(s => {
    if (s.direct) {
      h += `<div class="direct-row">↩ ${s.label} <a class="waze-btn" href="${s.waze}" target="_blank">Waze ↗</a></div>`;
    } else {
      const stop = s.stop ? `<span class="stop-pill">${s.stopLabel||'Stop'}</span>` : '';
      const wbtn = isBig
        ? `<a class="waze-btn-lg" href="${s.waze}" target="_blank">📍 Navigate</a>`
        : `<a class="waze-btn" href="${s.waze}" target="_blank">📍 Waze</a>`;
      const segCls = isBig ? 'today-rseg' : 'route-seg';
      const labelCls = isBig ? 'today-rseg-label' : 'route-seg-label';
      const metaCls = isBig ? 'today-rmeta' : 'route-meta';
      h += `<div class="${segCls}">
        <div class="${labelCls}">📍 ${s.from} → ${s.to} ${stop}</div>
        <span class="${metaCls}">${s.meta}</span>
        ${wbtn}
      </div>`;
    }
  });
  h += '</div>';
  return h;
}

function dinnerOptsHTML(opts, big) {
  let h = big ? '<div class="today-dinner-wrap">' : '<div class="dinner-wrap">';
  opts.forEach(o => {
    if (o.a) {
      h += big
        ? `<div class="td-opt td-opt-a"><div class="td-opt-title">Option A — ${o.title} <span class="d-rec">${o.rec}</span></div><div class="td-opt-detail">${o.detail}</div><div class="td-drive-note"><span>⚠️</span><div>${o.driveNote}</div></div><div style="margin-top:8px;font-size:12px;color:#065F46">${o.contact}</div></div>`
        : `<div class="d-opt d-opt-a"><div class="d-opt-title">Option A — ${o.title} <span class="d-rec">${o.rec}</span></div>${o.detail}<div class="d-drive-note"><span>⚠️</span><div>${o.driveNote}</div></div><div style="margin-top:6px;font-size:11px;color:#065F46">${o.contact}</div></div>`;
    } else {
      h += big
        ? `<div class="td-opt td-opt-b"><div class="td-opt-title">Option B — ${o.title}</div><div class="td-opt-detail">${o.detail} <span class="tag t-walk">🚶 Walk</span></div></div>`
        : `<div class="d-opt d-opt-b"><b>Option B — ${o.title}</b><br>${o.detail} <span class="tag t-walk">🚶 Walk</span></div>`;
    }
  });
  h += '</div>';
  return h;
}

// ═══════════════════════════════════════
// RENDER FULL PLAN
// ═══════════════════════════════════════
function renderPlan() {
  const container = document.getElementById('plan-content');
  const sections = {kl:[],genting:[],melaka:[]};
  const drives = [];

  TRIP.forEach(day => {
    if (day.dest === 'drive') drives.push(day);
    else sections[day.dest].push(day);
  });

  let html = '';

  // Helper to render day card
  function dayCard(day) {
    const dm = DEST_META[day.dest];
    let bodyHtml = '';
    if (day.warns.length) {
      day.warns.forEach(w => {
        bodyHtml += `<div class="today-warn"><span>⚠️</span><div>${w}</div></div>`;
      });
    }
    if (day.route) bodyHtml += routeBoxHTML(day.route, 'small');

    bodyHtml += '<div class="activity">';
    day.acts.forEach((a, i) => {
      bodyHtml += `<div class="activity">
        <div class="act-time">${a.time}</div>
        <div class="act-body">
          <div class="act-text">${a.detail||a.title}</div>`;
      if (a.contact) bodyHtml += `<div class="act-contact">${a.contact}</div>`;
      if (a.isDinner && a.dinnerOpts) bodyHtml += dinnerOptsHTML(a.dinnerOpts, false);
      bodyHtml += tagHTML(a.tags, a.transport);
      bodyHtml += '</div></div>';
    });
    bodyHtml += '</div>';

    return `<div class="day-card" id="dc-${day.n}">
      <div class="day-card-header" onclick="toggleDay(${day.n})">
        <span class="day-num" style="background:${dm.color}">Day ${day.n}</span>
        <div class="day-card-info">
          <div class="day-date">${day.short}</div>
          <div class="day-title-text">${day.title}</div>
          <div class="day-hotel-txt">🏨 ${day.hotel}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="day-body">${bodyHtml}</div>
    </div>`;
  }

  // Drive days first map for quick lookup
  const driveByDate = {};
  drives.forEach(d => { driveByDate[d.date] = d; });

  // Render drives between sections
  function driveCard(d) {
    return `<div class="section-header"><div class="section-line"></div><span>🚗 ${d.short} — ${d.title}</span><div class="section-line"></div></div>${dayCard(d)}`;
  }

  // Day 1 drive
  html += driveCard(TRIP[0]);

  // KL section
  const klDays = TRIP.filter(d => d.dest === 'kl');
  if (klDays.length) {
    const dm = DEST_META.kl;
    html += `<div class="section-header"><div class="section-line"></div><span style="color:${dm.color}">📍 Kuala Lumpur</span><div class="section-line"></div></div>`;
    klDays.forEach(d => { html += dayCard(d); });
  }

  // Day 3 drive
  html += driveCard(TRIP[2]);

  // Genting section
  const gtDays = TRIP.filter(d => d.dest === 'genting');
  if (gtDays.length) {
    const dm = DEST_META.genting;
    html += `<div class="section-header"><div class="section-line"></div><span style="color:${dm.color}">📍 Genting Highlands</span><div class="section-line"></div></div>`;
    gtDays.forEach(d => { html += dayCard(d); });
  }

  // Day 6 drive
  html += driveCard(TRIP[5]);

  // Melaka section
  const mlDays = TRIP.filter(d => d.dest === 'melaka');
  if (mlDays.length) {
    const dm = DEST_META.melaka;
    html += `<div class="section-header"><div class="section-line"></div><span style="color:${dm.color}">📍 Melaka</span><div class="section-line"></div></div>`;
    mlDays.forEach(d => { html += dayCard(d); });
  }

  // Day 8 drive
  html += driveCard(TRIP[7]);

  container.innerHTML = html;
}

function toggleDay(n) {
  const card = document.getElementById(`dc-${n}`);
  card.classList.toggle('open');
}

// ═══════════════════════════════════════
// RENDER TODAY
// ═══════════════════════════════════════
function renderToday() {
  const container = document.getElementById('today-content');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const tripStart = new Date(2026, 5, 13); // Jun 13
  const tripEnd   = new Date(2026, 5, 20); // Jun 20

  if (today < tripStart) {
    const diff = Math.ceil((tripStart - today) / 86400000);
    container.innerHTML = `
      <div class="offtrip">
        <div class="offtrip-emoji">✈️</div>
        <div class="countdown-num">${diff}</div>
        <div class="countdown-unit">${diff === 1 ? 'day' : 'days'} until departure</div>
        <div class="offtrip-title" style="margin-top:20px">Trip hasn't started yet!</div>
        <div class="offtrip-sub">You leave for Malaysia on <b>Saturday, 13 June 2026</b>.<br>Check the Full Plan tab to prepare.</div>
      </div>`;
    return;
  }

  if (today > tripEnd) {
    container.innerHTML = `
      <div class="offtrip">
        <div class="offtrip-emoji">🏁</div>
        <div class="offtrip-title">Trip Complete!</div>
        <div class="offtrip-sub">Hope it was an amazing 8 days across<br>KL, Genting, and Melaka 🇲🇾<br><br>Check the Full Plan tab to relive the memories.</div>
      </div>`;
    return;
  }

  const dayIdx = Math.floor((today - tripStart) / 86400000);
  const day = TRIP[dayIdx];
  const dm = DEST_META[day.dest];

  // Hero
  let heroHtml = `
    <div class="today-hero">
      <div class="today-status-line">Today · Day ${day.n} of 8</div>
      <div class="today-big">
        <div class="today-daynum">Day ${day.n}</div>
        <div class="today-big-right">
          <div class="today-datelabel">${day.full}</div>
        </div>
      </div>
      <div class="today-main-title">${day.title}</div>
      <span class="today-dest-pill" style="background:${dm.color}">${dm.label}</span>
      <div class="today-hotel">🏨 ${day.hotel}</div>
    </div>`;

  // Body
  let bodyHtml = '<div class="today-body">';

  // Warns
  if (day.warns.length) {
    day.warns.forEach(w => {
      bodyHtml += `<div class="today-warn"><span>⚠️</span><div>${w}</div></div>`;
    });
  }

  // Route navigation
  if (day.route) {
    bodyHtml += '<div class="today-sec-title">Navigation</div>';
    bodyHtml += routeBoxHTML(day.route, 'big');
  }

  // Activities timeline
  bodyHtml += '<div class="today-sec-title">Today\'s Schedule</div>';
  bodyHtml += '<div class="timeline">';

  day.acts.forEach((a, i) => {
    const isNow = (() => {
      const hr = now.getHours();
      const match = a.time.match(/(\d+):(\d+)\s*(am|pm)/i);
      if (!match) return false;
      let h = parseInt(match[1]);
      const ampm = match[3].toLowerCase();
      if (ampm === 'pm' && h !== 12) h += 12;
      if (ampm === 'am' && h === 12) h = 0;
      // Check if we're within 2 hours of this activity
      const nextAct = day.acts[i+1];
      let nextH = 24;
      if (nextAct) {
        const nm = nextAct.time.match(/(\d+):(\d+)\s*(am|pm)/i);
        if (nm) { let nh = parseInt(nm[1]); if(nm[3].toLowerCase()==='pm'&&nh!==12)nh+=12; if(nm[3].toLowerCase()==='am'&&nh===12)nh=0; nextH=nh; }
      }
      return hr >= h && hr < nextH;
    })();

    bodyHtml += `<div class="tl-item">
      <div class="tl-dot${isNow?' active':''}"></div>
      <div class="tl-card" style="${isNow?`border-color:${dm.color};border-width:1.5px`:''}">
        <div class="tl-time">${a.time}</div>
        <div class="tl-title">${a.title}</div>`;
    if (a.detail && !a.isDinner) {
      bodyHtml += `<div class="tl-detail">${a.detail}</div>`;
    }
    if (a.contact) bodyHtml += `<div class="tl-contact">${a.contact}</div>`;
    if (a.isDinner && a.dinnerOpts) {
      bodyHtml += '<div class="tl-detail">Choose your dinner:</div>';
      bodyHtml += dinnerOptsHTML(a.dinnerOpts, true);
    }
    bodyHtml += tagHTML(a.tags, a.transport);
    bodyHtml += '</div></div>';
  });

  bodyHtml += '</div></div>';
  container.innerHTML = heroHtml + bodyHtml;
}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function showPage(p) {
  document.getElementById('page-plan').classList.toggle('active', p === 'plan');
  document.getElementById('page-today').classList.toggle('active', p === 'today');
  document.getElementById('nav-plan').classList.toggle('active', p === 'plan');
  document.getElementById('nav-today').classList.toggle('active', p === 'today');
  window.scrollTo(0,0);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
renderPlan();
renderToday();
